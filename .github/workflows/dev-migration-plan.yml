name: Dev migration plan (Reader only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-supabase-dev-migration-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment:
      name: development-db-check
    env:
      DEV_SUPABASE_POOLER_HOST: ${{ vars.DEV_SUPABASE_POOLER_HOST }}
      DEV_SUPABASE_PROJECT_REF: ${{ vars.DEV_SUPABASE_PROJECT_REF }}
      DEV_MIGRATION_READER_PASSWORD: ${{ secrets.DEV_MIGRATION_READER_PASSWORD }}
      DB_TARGET: dev
      PGHOST: ${{ vars.DEV_SUPABASE_POOLER_HOST }}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: migration_preflight_login.${{ vars.DEV_SUPABASE_PROJECT_REF }}
      PGPASSWORD: ${{ secrets.DEV_MIGRATION_READER_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
    steps:
      - name: Require manual dispatch from main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Dev migration plans can only be dispatched manually from main." >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require the latest main commit
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"

      - name: Validate migration immutability and checksums before DB access
        run: |
          set -euo pipefail
          python3 scripts/check-migration-history.py \
            --migrations-dir supabase/migrations \
            --repo . \
            --base-ref "${GITHUB_SHA}^1" \
            --only-immutability
          python3 scripts/check-migrations.py
          {
            echo '## Dev migration plan'
            echo
            echo '- Migration inventory validation: PASS (filenames and SHA256SUMS)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recheck main and validate the dedicated Dev Reader target
        run: |
          set -euo pipefail
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          python3 scripts/validate-dev-db-contract-env.py

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client

      - name: Verify minimum Reader privileges
        run: |
          set -euo pipefail
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_dev_db_contract_reader.sql >/dev/null
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_migration_preflight_reader.sql >/dev/null
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_migration_reader_bootstrap.sql >/dev/null

      - name: Verify Dev DB identity as Reader
        run: |
          set -euo pipefail
          python3 scripts/verify-db-project-identity.py
          {
            echo '- Dev DB identity verification: PASS'
            echo '- Reader privilege verification: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recheck latest main before reading migration history
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"

      - name: Classify shared migration history without applying migrations
        run: |
          set -euo pipefail
          python3 scripts/run_dev_migration_plan.py \
            --migrations-dir supabase/migrations \
            --repo . \
            --base-ref "${GITHUB_SHA}^1" \
            --summary-file "$GITHUB_STEP_SUMMARY"
