name: Provision AI quota admin password
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target database
        required: true
        type: choice
        options: [dev, production]
permissions:
  actions: read
  contents: read
concurrency:
  group: shared-supabase-db-migration-apply-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  environment-check:
    runs-on: ubuntu-latest
    env:
      DB_TARGET: ${{ inputs.target }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require latest main and protected Environment
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          python3 scripts/check-writer-environment.py
  provision:
    timeout-minutes: 5
    needs: environment-check
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target == 'dev' && 'development-db-apply' || 'production-db-apply' }}
    env:
      DB_TARGET: ${{ inputs.target }}
      DB_ENVIRONMENT: ${{ inputs.target == 'dev' && 'development-db-apply' || 'production-db-apply' }}
      DB_CONNECTION_ROLE: writer
      DB_POOLER_HOST: ${{ (inputs.target == 'dev' && vars.DEV_SUPABASE_POOLER_HOST) || (inputs.target == 'production' && vars.PROD_SUPABASE_POOLER_HOST) || '' }}
      DB_PROJECT_REF: ${{ (inputs.target == 'dev' && vars.DEV_SUPABASE_PROJECT_REF) || (inputs.target == 'production' && vars.PROD_SUPABASE_PROJECT_REF) || '' }}
      PGHOST: ${{ (inputs.target == 'dev' && vars.DEV_SUPABASE_POOLER_HOST) || (inputs.target == 'production' && vars.PROD_SUPABASE_POOLER_HOST) || '' }}
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.${{ (inputs.target == 'dev' && vars.DEV_SUPABASE_PROJECT_REF) || (inputs.target == 'production' && vars.PROD_SUPABASE_PROJECT_REF) || '' }}
      PGPASSWORD: ${{ (inputs.target == 'dev' && secrets.DEV_MIGRATION_SUPABASE_DB_PASSWORD) || (inputs.target == 'production' && secrets.MIGRATION_SUPABASE_DB_PASSWORD) || '' }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: '10'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck approval protections and Writer identity configuration
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          python3 scripts/check-writer-environment.py
          python3 scripts/validate-writer-db-env.py
          python3 scripts/verify-psql-client.py
      - name: Set password and verify dedicated login
        env:
          AI_QUOTA_ADMIN_PASSWORD: ${{ (inputs.target == 'dev' && secrets.DEV_AI_QUOTA_ADMIN_PASSWORD) || (inputs.target == 'production' && secrets.PROD_AI_QUOTA_ADMIN_PASSWORD) || '' }}
        run: python3 scripts/provision-ai-quota-admin.py
