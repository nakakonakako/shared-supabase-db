name: Verify Dev DB Writer credentials (read-only)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: shared-supabase-dev-db-writer-identity-check
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Require manual dispatch from main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Dev Writer credential checks require manual dispatch from main." >&2
            exit 1
          fi
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the latest main commit
        run: python3 scripts/assert-latest-main.py "$GITHUB_SHA"

  verify-reader:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: development-db-check
    env:
      DEV_SUPABASE_POOLER_HOST: ${{ vars.DEV_SUPABASE_POOLER_HOST }}
      DEV_SUPABASE_PROJECT_REF: ${{ vars.DEV_SUPABASE_PROJECT_REF }}
      DEV_MIGRATION_READER_PASSWORD: ${{ secrets.DEV_MIGRATION_READER_PASSWORD }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_SHA: ${{ github.sha }}
      DB_TARGET: dev
      PGHOST: ${{ vars.DEV_SUPABASE_POOLER_HOST }}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: migration_preflight_login.${{ vars.DEV_SUPABASE_PROJECT_REF }}
      PGPASSWORD: ${{ secrets.DEV_MIGRATION_READER_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck main and validate the Reader target
        run: |
          set -euo pipefail
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          python3 scripts/validate-dev-db-contract-env.py
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
      - name: Verify minimum Reader privileges
        run: |
          set -euo pipefail
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_dev_db_contract_reader.sql >/dev/null
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_migration_preflight_reader.sql >/dev/null
          psql -X -w -v ON_ERROR_STOP=1 -f supabase/diagnostics/verify_migration_reader_bootstrap.sql >/dev/null
      - name: Verify the database-side Dev identity marker as Reader
        run: python3 scripts/verify-db-project-identity.py

  verify-writer-environment:
    needs: verify-reader
    if: needs.verify-reader.result == 'success'
    runs-on: ubuntu-latest
    env:
      DB_TARGET: dev
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require protected Dev Writer Environment
        run: python3 scripts/check-writer-environment.py

  verify-writer-credentials:
    needs: verify-writer-environment
    if: needs.verify-writer-environment.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: development-db-apply
    env:
      DB_TARGET: dev
      DB_ENVIRONMENT: development-db-apply
      DB_POOLER_HOST: ${{ vars.DEV_SUPABASE_POOLER_HOST }}
      DB_PROJECT_REF: ${{ vars.DEV_SUPABASE_PROJECT_REF }}
      DB_CONNECTION_ROLE: writer
      GITHUB_REF: ${{ github.ref }}
      GITHUB_SHA: ${{ github.sha }}
      PGHOST: ${{ vars.DEV_SUPABASE_POOLER_HOST }}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres.${{ vars.DEV_SUPABASE_PROJECT_REF }}
      PGPASSWORD: ${{ secrets.DEV_MIGRATION_SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck main and validate the Writer target
        run: |
          set -euo pipefail
          python3 scripts/assert-latest-main.py "$GITHUB_SHA"
          python3 scripts/validate-writer-db-env.py
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
      - name: Verify Writer authentication and database-side identity (read-only)
        run: python3 scripts/verify-db-project-identity.py
